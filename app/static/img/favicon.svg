<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    O ícone do site, e o que o Google desenha ao lado do resultado de busca.

    O `transform` existe por um motivo medido (22/08/2026): sem ele a marca
    ocupava 39% da largura do quadrado, o que num favicon de 16px vira 6,2
    pixels de desenho. No resultado de busca em tema escuro isso lia como um
    círculo apagado, sem marca reconhecível. Com escala 1.6 a altura vai a 76%
    do quadrado e sobram 12px de marca nos mesmos 16.

    As coordenadas dos polígonos são as MESMAS do logotipo do site (macro
    `lfmark` em base.html e o SVG inline de _cabecalho.html) — a escala é só
    de apresentação, aplicada aqui, para o desenho seguir sendo um só.
    O favicon.ico é gerado destas coordenadas com esta mesma escala; o teste
    tests/test_favicon_raiz.py compara os dois.
  -->
  <rect width="100" height="100" fill="#090909"/>
  <g fill="#ffffff" transform="translate(50 50.05) scale(1.6) translate(-50 -50.05)">
    <polygon points="57.6 73.8 30.6 73.8 30.6 35.7 40 35.7 40 63.9 59.5 63.9 57.6 73.8"/>
    <polygon points="64.9 54.5 49.4 54.5 49.4 45.1 66.6 45.1 64.9 54.5"/>
    <polygon points="67.6 35.7 49.4 35.7 49.4 26.3 69.4 26.3 67.6 35.7"/>
  </g>
</svg>
