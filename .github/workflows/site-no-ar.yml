# Confere de quinze em quinze minutos se o site está no ar, e falha se não
# estiver. Falha de workflow dispara e-mail para o dono do repositório.
#
# Por que aqui e não no servidor: cron no próprio VPS não avisa que o VPS
# caiu. O monitor precisa ser externo, e o GitHub Actions é gratuito e
# ilimitado em repositório público, então custa zero e não pede conta nova.
#
# O que ele NÃO é: monitoramento com histórico, percentil de latência e
# painel. É o aviso de que o site parou, que é o que faltava.
name: site no ar

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  responde:
    runs-on: ubuntu-latest
    steps:
      # DOIS RUNS SEGUIDOS para alarmar, e a razão é o fim de semana de
      # 28-31/08: mais de trinta e-mails de "site fora do ar" com o site DE
      # PÉ o tempo todo. O nginx não registrou nenhum 5xx no período; nas
      # janelas de falha, o pedido do runner nem CHEGOU ao servidor — soluço
      # de rota IPv4 entre a Azure e a Hostinger, que dura minutos e some.
      #
      # A regra nova: falhou agora E falhou no run anterior (15 min atrás),
      # aí sim é queda de verdade e o e-mail sai. Falha isolada vira aviso
      # no run, sem e-mail. Queda real continua detectada em ≤30 min.
      - name: A home responde 200 (alarme só em falha persistente)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tentativa in 1 2 3 4; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 25 https://leandrofurtado.com.br/ || echo 000)
            echo "tentativa $tentativa: $codigo"
            [ "$codigo" = "200" ] && exit 0
            sleep 25
          done
          anterior=$(curl -s -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/site-no-ar.yml/runs?per_page=2&status=completed"             | python3 -c "import json,sys; rs=json.load(sys.stdin)['workflow_runs']; print(rs[0]['conclusion'] if rs else 'none')")
          echo "run anterior: $anterior"
          if [ "$anterior" = "failure" ]; then
            echo "::error::a home não responde há dois runs seguidos (30+ min): queda de verdade"
            exit 1
          fi
          echo "::warning::a home não respondeu NESTE run (soluço de rota Azure→Hostinger); o alarme sai se o próximo também falhar"
          exit 0

      - name: O certificado ainda tem mais de 10 dias
        run: |
          fim=$(echo | openssl s_client -connect leandrofurtado.com.br:443 \
                  -servername leandrofurtado.com.br 2>/dev/null \
                | openssl x509 -noout -enddate | cut -d= -f2)
          faltam=$(( ( $(date -d "$fim" +%s) - $(date +%s) ) / 86400 ))
          echo "vence em $faltam dias ($fim)"
          if [ "$faltam" -lt 10 ]; then
            echo "::error::certificado vence em $faltam dias e a renovação automática não rodou"
            exit 1
          fi
