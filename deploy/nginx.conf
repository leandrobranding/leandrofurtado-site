# /etc/nginx/sites-available/leandrofurtado.com.br
# Ative com: ln -s /etc/nginx/sites-available/leandrofurtado.com.br /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name leandrofurtado.com.br www.leandrofurtado.com.br;
    # O certbot converte este bloco para redirecionar ao HTTPS automaticamente.

    location / {
        return 301 https://leandrofurtado.com.br$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.leandrofurtado.com.br;

    # Certificados (preenchidos pelo certbot)
    ssl_certificate     /etc/letsencrypt/live/leandrofurtado.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leandrofurtado.com.br/privkey.pem;

    return 301 https://leandrofurtado.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name leandrofurtado.com.br;

    ssl_certificate     /etc/letsencrypt/live/leandrofurtado.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leandrofurtado.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 320M;

    # --- Tela de atualização -------------------------------------------------
    # Num deploy o container reinicia e o proxy responde 502 por alguns segundos.
    # Sem isto, quem entrasse nesse instante via a tela de erro do nginx e ia
    # embora achando que o site não existe mais. A página vive em disco, fora do
    # container, justamente porque só é necessária quando o container está fora.
    #
    # Sai como 503 e não como 502: 503 é "indisponível agora, volte já", é o que
    # buscador entende como temporário e é o único que não custa posicionamento.
    error_page 502 503 504 =503 /_atualizando.html;

    location = /_atualizando.html {
        internal;
        root /var/www/lf-manutencao;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Progresso do deploy e as fontes da marca. Servido do disco pelo nginx: se
    # passasse pelo proxy, estaria fora no exato momento em que é preciso.
    location ^~ /_deploy/ {
        alias /var/www/lf-manutencao/;
        add_header Cache-Control "no-store" always;
        types {
            application/json  json;
            font/woff2        woff2;
            image/svg+xml     svg;
        }
        default_type application/octet-stream;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # css/js levam ?v= (mtime do build): o nome nunca muda de conteúdo sem o v
    # mudar junto, então podem ficar "immutable" o ano inteiro. Regra bate antes
    # do /static/ genérico abaixo (regex vence prefixo sem ^~ no nginx).
    # woff2 FICA DE FORA de propósito: não tem ?v= em lugar nenhum — nem no
    # preload (base.html), nem no @font-face (main.css, que é estático e não
    # pode levar query string). "immutable" 1 ano numa URL sem versão seria
    # staleness silenciosa se a fonte um dia mudar; por isso a fonte cai na
    # regra /static/ genérica de 7 dias, abaixo.
    # X-Real-IP e X-Forwarded-For precisam estar em TODA location que faz
    # proxy_pass, não só na / de baixo: o nginx sobrescreve os dois
    # incondicionalmente, então é isso (e só isso) que impede o cliente de
    # forjar o próprio IP. Uma location sem estas duas linhas repassa os
    # cabeçalhos crus que o cliente mandou, e o app do outro lado acaba
    # confiando num IP que o próprio visitante escolheu.
    location ~* ^/static/.*\.(css|js)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Sem estes três, o cliente forja o próprio IP nesta location e o
        # limitador de taxa passa a contar visitantes que não existem. Já
        # aconteceu uma vez (incidente de 20/08) e voltou a sumir daqui numa
        # edição posterior: agora está em TODAS as locations, sem exceção.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # cache agressivo para estáticos (fingerprint não é usado; ajuste se trocar assets)
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Sem estes três, o cliente forja o próprio IP nesta location e o
        # limitador de taxa passa a contar visitantes que não existem. Já
        # aconteceu uma vez (incidente de 20/08) e voltou a sumir daqui numa
        # edição posterior: agora está em TODAS as locations, sem exceção.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800";
    }
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Sem estes três, o cliente forja o próprio IP nesta location e o
        # limitador de taxa passa a contar visitantes que não existem. Já
        # aconteceu uma vez (incidente de 20/08) e voltou a sumir daqui numa
        # edição posterior: agora está em TODAS as locations, sem exceção.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
